<script>

{name:"Nutella Cake",price:500},

{name:"Mini Cake",price:150},
{name:"Cup Cake",price:70},
{name:"Cup Cake Chocolate",price:50},
{name:"Cup Cake Vanilla",price:40},
{name:"Cup Cake Strawberry",price:30},

{name:"Premium Cake 1",price:700},
{name:"Premium Cake 2",price:750},
{name:"Premium Cake 3",price:800},
{name:"Premium Cake 4",price:850},
{name:"Premium Cake 5",price:900},

{name:"Special Cake 1",price:400},
{name:"Special Cake 2",price:420},
{name:"Special Cake 3",price:430},
{name:"Special Cake 4",price:450},
{name:"Special Cake 5",price:480}

]

let cart=[]

function loadCakes(){

let html=""

cakes.forEach((cake,i)=>{

html+=`

<div class="cake">

<h4>${cake.name}</h4>

₹ ${cake.price}

<br>

<button onclick="addCart(${i})" class="cartbtn">

Add to Cart

</button>

</div>

`

})

document.getElementById("cakes").innerHTML=html

}

loadCakes()

function addCart(i){

cart.push(cakes[i])

document.getElementById("cartCount").innerText=cart.length

updateCart()

}

function updateCart(){

let html=""

cart.forEach(c=>{

html+=c.name+" ₹"+c.price+"<br>"

})

document.getElementById("cartItems").innerHTML=html

}

function toggleCart(){

let box=document.getElementById("cartBox")

box.style.display=box.style.display=="block"?"none":"block"

}

function orderWhatsApp(){

let msg="RK Bakery Order:%0A"

cart.forEach(c=>{

msg+=c.name+" ₹"+c.price+"%0A"

})

window.open("https://wa.me/916378467476?text="+msg)

}

function payUPI(){

window.open("upi://pay?pa=Q349371191@ybl&pn=RK Bakery")

}

function installApp(){

alert("Open Chrome menu → Add to Home Screen")

}

function directions(){

window.open("https://maps.google.com/?q=26.8818326,75.2389793")

}

const shopLat=26.8818326
const shopLng=75.2389793

function getLocation(){

navigator.geolocation.getCurrentPosition(showPosition)

}

function showPosition(position){

let userLat=position.coords.latitude
let userLng=position.coords.longitude

let distance=calcDistance(userLat,userLng)

if(distance<=50){

alert("Delivery Available")

}else{

alert("Delivery Not Available")

}

}

function calcDistance(lat2,lng2){

let R=6371

let dLat=(lat2-shopLat)*Math.PI/180
let dLng=(lng2-shopLng)*Math.PI/180

let a=

Math.sin(dLat/2)*Math.sin(dLat/2)+
Math.cos(shopLat*Math.PI/180)*
Math.cos(lat2*Math.PI/180)*
Math.sin(dLng/2)*Math.sin(dLng/2)

let c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))

return R*c

}
